[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "igcaller"
version = "1.4b0"
description = "Reconstructing immunoglobulin gene rearrangements and oncogenic translocations from WGS"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "regex",
    "numpy",
    "scipy",
]

[project.scripts]
igcaller = "igcaller.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
